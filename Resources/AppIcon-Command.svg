<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.55" stop-color="#F4B842"/>
      <stop offset="1" stop-color="#C97A12"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFDFE"/>
      <stop offset="0.18" stop-color="#D4DBE2"/>
      <stop offset="0.40" stop-color="#7E8893"/>
      <stop offset="0.55" stop-color="#2C3138"/>
      <stop offset="0.72" stop-color="#7E8893"/>
      <stop offset="0.90" stop-color="#D4DBE2"/>
      <stop offset="1" stop-color="#F4F7FA"/>
    </linearGradient>

    <linearGradient id="chromeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="0.92" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Squircle background (rounded rect approximating Apple HIG corner radius) -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#innerGlow)"/>

  <!-- Concentric sound-wave arcs (left + right of center V) -->
  <g fill="none" stroke="#7A4810" stroke-linecap="round">
    <!-- Left arcs -->
    <path d="M 296 380 Q 220 512 296 644" stroke-width="16" opacity="0.55"/>
    <path d="M 230 350 Q 134 512 230 674" stroke-width="16" opacity="0.38"/>
    <path d="M 162 318 Q 50 512 162 706" stroke-width="16" opacity="0.22"/>
    <!-- Right arcs (mirror) -->
    <path d="M 728 380 Q 804 512 728 644" stroke-width="16" opacity="0.55"/>
    <path d="M 794 350 Q 890 512 794 674" stroke-width="16" opacity="0.38"/>
    <path d="M 862 318 Q 974 512 862 706" stroke-width="16" opacity="0.22"/>
  </g>

  <!-- Center "V" (chrome). Drop shadow group. -->
  <g>
    <!-- Soft drop shadow behind V -->
    <g filter="url(#softShadow)" opacity="0.35">
      <path d="M 240 270 L 390 270 L 512 575 L 634 270 L 784 270 L 596 740 L 428 740 Z"
            fill="#0F2A2A"/>
    </g>
    <!-- Chrome fill -->
    <path d="M 240 270 L 390 270 L 512 575 L 634 270 L 784 270 L 596 740 L 428 740 Z"
          fill="url(#chrome)"
          stroke="#1A1E22" stroke-width="6" stroke-linejoin="round"/>
    <!-- Top + bottom highlight band -->
    <path d="M 240 270 L 390 270 L 512 575 L 634 270 L 784 270 L 596 740 L 428 740 Z"
          fill="url(#chromeShine)"/>
  </g>

  <!-- Small waveform sitting horizontally inside the V's central trough -->
  <g fill="#7A4810" opacity="0.92">
    <rect x="430" y="498" width="16" height="92"  rx="7"/>
    <rect x="462" y="470" width="16" height="148" rx="7"/>
    <rect x="494" y="442" width="16" height="204" rx="7"/>
    <rect x="526" y="470" width="16" height="148" rx="7"/>
    <rect x="558" y="498" width="16" height="92"  rx="7"/>
  </g>
</svg>
