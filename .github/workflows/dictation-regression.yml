name: Dictation Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dictation-regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run dictation regression suite
        run: scripts/run-dictation-regression.sh
