name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify-release-quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run full tests
        run: swift test
      - name: Enforce dictation regression gate
        run: scripts/run-dictation-regression.sh
